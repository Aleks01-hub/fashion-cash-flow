spring:
  application:
    name: caixa-central-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/caixa_central}
    username: ${DATABASE_USER:caixa}
    password: ${DATABASE_PASSWORD:caixa}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
