spring:
  application:
    name: caixa-central-api
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/caixa_central?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USER:caixa}
    password: ${DATABASE_PASSWORD:caixa_dev_change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${SERVER_PORT:8080}
