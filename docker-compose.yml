services:
  postgres:
    image: postgres:18.6-alpine
    container_name: caixa-central-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: caixa_central
      POSTGRES_USER: caixa
      POSTGRES_PASSWORD: caixa
    ports:
      - "5432:5432"
    volumes:
      - caixa-central-postgres:/var/lib/postgresql/data

volumes:
  caixa-central-postgres:
