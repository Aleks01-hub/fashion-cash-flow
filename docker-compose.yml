services:
  mysql:
    image: mysql:8.4
    container_name: caixa-central-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: caixa_central
      MYSQL_USER: caixa
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-caixa_dev_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_change_me}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - caixa-central-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  caixa-central-mysql:
